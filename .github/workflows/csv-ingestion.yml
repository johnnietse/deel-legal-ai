name: CSV Ingestion Automation

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Cases per run'
        required: false
        default: '20'
        type: string
      max_retries:
        description: 'Max retries per batch'
        required: false
        default: '3'
reset_progress:
        description: 'Reset progress and start fresh'
        required: false
        default: 'false'
        type: boolean

env:
  PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
  GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
  JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
  ELASTICSEARCH_CLOUD_ID: ${{ secrets.ELASTICSEARCH_CLOUD_ID }}
  ELASTICSEARCH_API_KEY: ${{ secrets.ELASTICSEARCH_API_KEY }}

jobs:
  csv-ingestion:
    runs-on: windows-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run CSV Ingestion
        id: ingestion
        run: |
<<<<<<< HEAD
          python rag_pipeline/csv_ingestion_wrapper.py `
            --batch-size ${{ github.event.inputs.batch_size || '20' }} `
            --max-retries ${{ github.event.inputs.max_retries || '3' }} `
            ${{ github.event.inputs.reset_progress == 'true' && '--reset' || '' }}
        shell: pwsh
      
      - name: Upload Progress Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-progress
          path: rag_pipeline/ingestion_progress.json
          retention-days: 30
      
      - name: Summary
        if: always()
        run: |
          $progress = Get-Content rag_pipeline/ingestion_progress.json | ConvertFrom-Json
          Write-Host "## Ingestion Summary" -ForegroundColor Green
          Write-Host "- Completed cases: $($progress.completed_case_ids.Count)"
          Write-Host "- Total upserted: $($progress.total_upserted)"
          Write-Host "- Total failed: $($progress.total_failed)"
          Write-Host "- Last run: $($progress.last_run)"
        shell: pwsh

  # Optional: Notify on failure
  notify-failure:
    needs: csv-ingestion
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        run: |
          echo "CSV ingestion workflow failed. Check GitHub Actions for details."
          # Add your notification logic here (Slack, email, etc.)