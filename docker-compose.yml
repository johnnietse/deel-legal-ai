# Docker Compose for OpenJustice.ai — minimal working stack
# Only services that are actually used and working.
# Optional infra (Elasticsearch, Milvus) moved to docker-compose.infra.yml.

services:
  # Main API Service — the product
  legal-ai-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: deel-legal-ai-api
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - SEARCH_GEMINI_API_KEY=${SEARCH_GEMINI_API_KEY}
      - DEV_MODE=${DEV_MODE:-0}
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=${CORS_ORIGINS}
      - VECTOR_STORE_BACKEND=${VECTOR_STORE_BACKEND:-pinecone}
      - BM25_BACKEND=${BM25_BACKEND:-local}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-}
      - MILVUS_HOST=${MILVUS_HOST:-}
      - MILVUS_PORT=${MILVUS_PORT:-}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # RAG Pipeline Worker (background processing, opt-in)
  rag-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: deel-rag-worker
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - SEARCH_GEMINI_API_KEY=${SEARCH_GEMINI_API_KEY}
      - DEV_MODE=${DEV_MODE:-0}
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=${CORS_ORIGINS}
      - VECTOR_STORE_BACKEND=${VECTOR_STORE_BACKEND:-pinecone}
      - BM25_BACKEND=${BM25_BACKEND:-local}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-}
      - MILVUS_HOST=${MILVUS_HOST:-}
      - MILVUS_PORT=${MILVUS_PORT:-}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    command: [ "python", "-m", "rag_pipeline.pipeline", "--reindex" ]
    profiles:
      - worker

  # ML Training Job (one-time, opt-in)
  ml-trainer:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: deel-ml-trainer
    environment:
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./law-dataset-exploring-main:/app/law-dataset-exploring-main:ro
    command: [ "python", "-m", "ml_classifier.train_classifier", "--train" ]
    profiles:
      - train

volumes:
  data:
  models:
  logs:

networks:
  default:
    name: deel-legal-ai-network
