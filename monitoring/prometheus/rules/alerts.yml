# OpenJustice.ai — Prometheus Alert Rules
# Alerts fire at warning → critical severity with appropriate thresholds

groups:
  - name: openjustice-api
    interval: 30s
    rules:
      # ================================
      # API High Error Rate
      # ================================
      - alert: APIHighErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m])
          /
          rate(http_requests_total[5m])
          > 0.05
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "API error rate exceeds 5%"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes"
          runbook_url: "https://wiki.openjustice.ai/runbooks/api-high-error-rate"

      # ================================
      # API High Latency (p95)
      # ================================
      - alert: APIHighLatency
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 5
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "API p95 latency exceeds 5 seconds"
          description: "p95 latency is {{ $value | humanizeDuration }} over the last 5 minutes"

      # ================================
      # API p99 Latency Critical
      # ================================
      - alert: APIP99HighLatency
        expr: |
          histogram_quantile(0.99,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 10
        for: 3m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "API p99 latency exceeds 10 seconds"
          description: "p99 latency is {{ $value | humanizeDuration }} over the last 3 minutes"

      # ================================
      # API Service Down
      # ================================
      - alert: APIServiceDown
        expr: up{job="openjustice-api"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "API service is unreachable"
          description: "API endpoint {{ $labels.instance }} has been down for {{ $value }}"

  # ================================
  # RAG Pipeline Performance
  # ================================
  - name: openjustice-rag
    interval: 30s
    rules:
      - alert: RAGQueryHighLatency
        expr: |
          histogram_quantile(0.95,
            rate(rag_query_duration_seconds_bucket[5m])
          ) > 15
        for: 5m
        labels:
          severity: warning
          team: ml
        annotations:
          summary: "RAG query p95 latency exceeds 15 seconds"
          description: "RAG p95 latency is {{ $value | humanizeDuration }}"

      - alert: RAGQueryErrorRate
        expr: |
          rate(rag_query_errors_total[5m])
          /
          rate(rag_query_total[5m])
          > 0.03
        for: 5m
        labels:
          severity: critical
          team: ml
        annotations:
          summary: "RAG query error rate exceeds 3%"
          description: "RAG error rate is {{ $value | humanizePercentage }}"

      - alert: RAGRetrieverEmpty
        expr: rate(rag_retriever_empty_results_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
          team: ml
        annotations:
          summary: "RAG retriever returning empty results"
          description: "Vector/BM25 retriever returned no results {{ $value }} times in 10m"

  # ================================
  # Infrastructure Health
  # ================================
  - name: openjustice-infra
    interval: 30s
    rules:
      # Node down
      - alert: NodeExporterDown
        expr: up{job="openjustice-node"} == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Node exporter is down"
          description: "Host metrics unavailable for {{ $labels.instance }}"

      # High CPU usage
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "CPU usage above 85%"
          description: "CPU is at {{ $value | humanizePercentage }} on {{ $labels.instance }}"

      # High memory usage
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Memory usage above 90%"
          description: "Memory is at {{ $value | humanizePercentage }} on {{ $labels.instance }}"

      # Disk space
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}) * 100 < 10
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Disk space below 10%"
          description: "Disk is at {{ $value | humanizePercentage }} available on {{ $labels.instance }}"

      # Disk IO
      - alert: HighDiskIO
        expr: rate(node_disk_io_time_seconds_total[5m]) > 0.9
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High disk I/O utilization"
          description: "Disk I/O is at {{ $value | humanizePercentage }} on {{ $labels.instance }}"

  # ================================
  # Data Store Health
  # ================================
  - name: openjustice-datastores
    interval: 30s
    rules:
      # Elasticsearch
      - alert: ElasticsearchDown
        expr: elasticsearch_cluster_health_status != 1
        for: 2m
        labels:
          severity: critical
          team: data
        annotations:
          summary: "Elasticsearch cluster unhealthy"
          description: "ES cluster status is not green"

      # Milvus
      - alert: MilvusDown
        expr: up{job="openjustice-milvus"} == 0
        for: 2m
        labels:
          severity: critical
          team: data
        annotations:
          summary: "Milvus vector store is down"
          description: "Milvus has been unreachable for 2 minutes"

      # PostgreSQL
      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
          team: data
        annotations:
          summary: "PostgreSQL is down"
          description: "Database has been unreachable for 2 minutes"

      # Redis
      - alert: RedisDown
        expr: redis_up == 0
        for: 2m
        labels:
          severity: critical
          team: data
        annotations:
          summary: "Redis is down"
          description: "Cache has been unreachable for 2 minutes"

      # PostgreSQL connection saturation
      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
          team: data
        annotations:
          summary: "PostgreSQL connections near limit"
          description: "Active connections: {{ $value }}"

  # ================================
  # Business Metrics
  # ================================
  - name: openjustice-business
    interval: 5m
    rules:
      - alert: ZeroQueriesDetected
        expr: rate(rag_query_total[1h]) == 0
        for: 1h
        labels:
          severity: warning
          team: product
        annotations:
          summary: "No RAG queries in the last hour"
          description: "Possible service degradation or user engagement drop"

      - alert: ClassificationErrorsSpike
        expr: rate(classification_errors_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          team: ml
        annotations:
          summary: "Classification error spike"
          description: "{{ $value }} classification errors in the last 5 minutes"
