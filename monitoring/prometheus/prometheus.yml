# OpenJustice.ai — Prometheus Configuration
# Scrapes metrics from API, frontend, node, containers, and vector store

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    environment: ${ENVIRONMENT:-production}
    cluster: openjustice

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Alert rules
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Scrape targets
scrape_configs:
  # ================================
  # OpenJustice.ai API service
  # ================================
  - job_name: "openjustice-api"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "legal-ai-api:8000"
        labels:
          service: "api"
          tier: "backend"

  # ================================
  # Frontend nginx
  # ================================
  - job_name: "openjustice-frontend"
    metrics_path: /nginx-health
    static_configs:
      - targets:
          - "frontend:80"
        labels:
          service: "frontend"
          tier: "frontend"

  # ================================
  # PostgreSQL
  # ================================
  - job_name: "openjustice-postgres"
    static_configs:
      - targets:
          - "postgres-exporter:9187"
        labels:
          service: "postgres"
          tier: "data"

  # ================================
  # Redis
  # ================================
  - job_name: "openjustice-redis"
    static_configs:
      - targets:
          - "redis-exporter:9121"
        labels:
          service: "redis"
          tier: "cache"

  # ================================
  # Elasticsearch
  # ================================
  - job_name: "openjustice-elasticsearch"
    static_configs:
      - targets:
          - "elasticsearch-exporter:9114"
        labels:
          service: "elasticsearch"
          tier: "data"

  # ================================
  # Milvus
  # ================================
  - job_name: "openjustice-milvus"
    static_configs:
      - targets:
          - "milvus-standalone:9091"
        labels:
          service: "milvus"
          tier: "data"

  # ================================
  # Node Exporter (host metrics)
  # ================================
  - job_name: "openjustice-node"
    static_configs:
      - targets:
          - "node-exporter:9100"
        labels:
          service: "node"

  # ================================
  # cAdvisor (container metrics)
  # ================================
  - job_name: "openjustice-cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"
        labels:
          service: "cadvisor"

  # ================================
  # Prometheus itself
  # ================================
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
