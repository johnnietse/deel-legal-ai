# OpenJustice.ai — Monitoring Stack (Prometheus + Grafana + Loki + AlertManager)
# Extends the base docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f monitoring/docker-compose.monitoring.yml up -d

services:
  # ================================
  # Prometheus — Metrics Collection
  # ================================
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: openjustice-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules/:/etc/prometheus/rules/:ro
      - prometheus_data:/prometheus
    networks:
      - openjustice-backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "2Gi"
        reservations:
          cpus: "0.5"
          memory: "1Gi"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ================================
  # Loki — Log Aggregation
  # ================================
  loki:
    image: grafana/loki:3.1.0
    container_name: openjustice-loki
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/loki.yml"
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - openjustice-backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1Gi"
        reservations:
          cpus: "0.25"
          memory: "512Mi"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ================================
  # Promtail — Log Collector
  # ================================
  promtail:
    image: grafana/promtail:3.1.0
    container_name: openjustice-promtail
    restart: unless-stopped
    command:
      - "-config.file=/etc/promtail/promtail.yml"
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
    networks:
      - openjustice-backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.1"
          memory: "128M"

  # ================================
  # Grafana — Visualization
  # ================================
  grafana:
    image: grafana/grafana:11.1.0
    container_name: openjustice-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=https://grafana.openjustice.ai
      - GF_UNIFIED_ALERTING_ENABLED=true
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/dashboards/:/etc/grafana/provisioning/dashboards/:ro
      - ./grafana/datasources/:/etc/grafana/provisioning/datasources/:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - openjustice-backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1Gi"
        reservations:
          cpus: "0.25"
          memory: "256M"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ================================
  # AlertManager — Alert Routing
  # ================================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: openjustice-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - openjustice-backend
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ================================
  # Node Exporter — Host Metrics
  # ================================
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: openjustice-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - openjustice-backend
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128M"

  # ================================
  # cAdvisor — Container Metrics
  # ================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: openjustice-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    networks:
      - openjustice-backend
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"

networks:
  openjustice-backend:
    name: openjustice-backend
    external: true

volumes:
  prometheus_data:
    name: openjustice-prometheus-data
  loki_data:
    name: openjustice-loki-data
  grafana_data:
    name: openjustice-grafana-data
  alertmanager_data:
    name: openjustice-alertmanager-data
