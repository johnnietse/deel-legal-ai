# Docker Compose for OpenJustice.ai — Production Override
# Extends the base docker-compose.yml with:
#   - Frontend service (nginx SPA + API proxy)
#   - PostgreSQL (auth/user data)
#   - Redis (caching + session store)
#   - Resource limits, health checks, network isolation
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.monitoring.yml up -d

services:
  # ================================
  # Frontend — nginx serving built SPA
  # ================================
  frontend:
    image: nginx:1.27-alpine
    container_name: openjustice-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./openjustice-frontend/dist:/usr/share/nginx/html:ro
      - ./openjustice-frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/certs:/etc/nginx/certs:ro
    environment:
      - API_URL=http://legal-ai-api:8000
    depends_on:
      legal-ai-api:
        condition: service_healthy
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.1"
          memory: "128M"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ================================
  # PostgreSQL — Auth, Users, Subscriptions
  # ================================
  postgres:
    image: postgres:16-alpine
    container_name: openjustice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: openjustice
      POSTGRES_USER: ${POSTGRES_USER:-openjustice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    # ports: - "5432:5432"  # Not exposed to host in production — only accessible via Docker networks
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/backup/scripts:/scripts:ro
    networks:
      - backend
      - data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2Gi"
        reservations:
          cpus: "0.5"
          memory: "512Mi"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openjustice} -d openjustice"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ================================
  # Redis — Caching + Session Store
  # ================================
  redis:
    image: redis:7.4-alpine
    container_name: openjustice-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1Gi"
        reservations:
          cpus: "0.25"
          memory: "256Mi"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ================================
  # Override: legal-ai-api with production config
  # ================================
  legal-ai-api:
    container_name: openjustice-api
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-openjustice}:${POSTGRES_PASSWORD}@postgres:5432/openjustice
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - CORS_ORIGINS=${CORS_ORIGINS:-https://openjustice.ai}
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_REQUESTS=100
      - RATE_LIMIT_WINDOW=60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - data
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: "4Gi"
        reservations:
          cpus: "1.0"
          memory: "1Gi"

  # ================================
  # Override: Elasticsearch with resource limits
  # ================================
  elasticsearch:
    container_name: openjustice-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=${ES_SECURITY_ENABLED:-true}
      - xpack.security.authc.api_key.enabled=true
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required}
      - ELASTIC_USER=elastic
    ports:
      - "9200:9200"
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "4Gi"
        reservations:
          cpus: "1.0"
          memory: "2Gi"

  # ================================
  # Override: Milvus with production tuning
  # ================================
  milvus-standalone:
    container_name: openjustice-milvus
    restart: unless-stopped
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      # Production tuning
      milvus_common_retention_duration: "720h"  # 30 days
      milvus_quota_ddl_collection_rate: 10
      milvus_quota_ddl_partition_rate: 10
      milvus_quota_index_rate: 5
      milvus_quota_flush_rate: 100
      milvus_quota_compaction_rate: 10
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: "8Gi"
        reservations:
          cpus: "2.0"
          memory: "4Gi"

# ================================
# Networks — Three-tier isolation
# ================================
networks:
  frontend:
    name: openjustice-frontend
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  backend:
    name: openjustice-backend
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.1.0/24
  data:
    name: openjustice-data
    driver: bridge
    internal: true  # No external access
    ipam:
      config:
        - subnet: 172.20.2.0/24

# ================================
# Named Volumes
# ================================
volumes:
  postgres_data:
    name: openjustice-postgres-data
    driver: local
  redis_data:
    name: openjustice-redis-data
    driver: local
